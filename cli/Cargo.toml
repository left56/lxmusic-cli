[package]
name = "lxmusic-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Download-only CLI for user-supplied lx-music JavaScript sources"
publish = false

[[bin]]
name = "lxmusic-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8.4"
base64 = "0.22"
cbc = "0.1.2"
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
clap = { version = "4", features = ["derive"] }
ecb = "0.1.2"
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
lofty = "0.25"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rquickjs = { version = "0.12.2", features = ["array-buffer"] }
rsa = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = "2"

[dev-dependencies]
rand = "0.8"
tempfile = "3"
